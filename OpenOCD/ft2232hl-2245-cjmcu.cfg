#
# ------------------------------------------------------------------------------------
# FTDI 2232HL 2245 CJMCU
# ------------------------------------------------------------------------------------
# 
# >>>> Future Technology Devices International, Ltd FT2232C/D/H Dual UART/FIFO IC <<<<
# 
# Product: https://ftdichip.com/products/ft2232hl/
# Datasheet: https://ftdichip.com/wp-content/uploads/2024/09/DS_FT2232H.pdf
#

#
# Driver Selection
#
adapter driver ftdi

#
# Driver Configuration
#
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x001b
ftdi layout_signal nSRST -data 0x0010 -oe 0x0040
ftdi layout_signal nTRST -data 0x0020 -oe 0x0040

