#
# Speed Configuration
#
adapter speed 1000

#
# TAP Definitions
# 
# Reference: SPT_KBP.patch file from Kakaroto's blog
#
jtag newtap spt rgnleft -irlen 8 -expected-id 0x02080003

jtag newtap spt parcsmea -irlen 8 -expected-id 0x2086103

jtag newtap spt csme -irlen 8 -expected-id 0x08086101

jtag newtap spt parcsmeretime -irlen 8 -expected-id 0x0008610B

jtag newtap spt rgnlb -irlen 8 -expected-id 0x02080005

jtag newtap spt parish -irlen 8 -expected-id 0x02088201

jtag newtap spt parishretime -irlen 8 -expected-id 0x0008800B

jtag newtap spt rgnbottom -irlen 8 -expected-id 0x02080007

jtag newtap spt rgntop -irlen 8 -expected-id 0x02080009

jtag newtap spt agg -irlen 8 -expected-id 0x0008000B

jtag newtap spt cltapretime -irlen 8 -expected-id 0x0008000F

#
# Target Configurations
#
target create spt.me quark_x10xx -chain-position spt.csme

#target create spt.cpu x86_64 -dap spt.cpu_tap



